name: Build Windows executable

# This repo's root IS the build-windows folder (launcher.py and
# invisible-cities/ live at the top level). Push to main/master and GitHub's
# free windows-latest runner builds the .exe — no Windows machine needed.
# Download the result from the workflow run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: |
          pyinstaller --onefile --name "InvisibleCities-Windows-x86_64" --add-data "invisible-cities;invisible-cities" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: InvisibleCities-Windows-x86_64
          path: dist/InvisibleCities-Windows-x86_64.exe
